name: Bug report
description: Report a reproducible problem in the project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include secrets, personal data, or confidential research material.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the release or commit if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, browser, and runtime details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed secrets and personal, patient, or confidential data.
          required: true
