name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  static:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package static application
        run: tar -czf "openbiofigure-static-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: openbiofigure-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: openbiofigure-static-${{ github.ref_name }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: static-release
          path: |
            openbiofigure-static-${{ github.ref_name }}.tar.gz
            openbiofigure-${{ github.ref_name }}.spdx.json

  windows:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Get-ChildItem release-assets/* | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release-assets/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*

  publish:
    needs: [static, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
