[package]
name = "openbiofigure"
version = "0.2.0"
description = "Local-first, attribution-aware scientific figure editor"
authors = ["Voldigoade"]
license = "Apache-2.0"
repository = "https://github.com/Voldigoade/openbiofigure"
edition = "2021"

[lib]
name = "openbiofigure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
